# Whole stack locally: `docker compose up --build` → UI on http://localhost:8501
services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports: ["6333:6333"]
    volumes: ["./qdrant_storage:/qdrant/storage"]

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      INNGEST_DEV: "true"
      INNGEST_BASE_URL: http://inngest:8288
    volumes: ["./uploads:/app/uploads"]
    ports: ["8000:8000"]
    depends_on: [qdrant]

  inngest:
    image: inngest/inngest:v1.53.0
    command: inngest dev -u http://api:8000/api/inngest --no-discovery
    ports: ["8288:8288"]
    depends_on: [api]

  ui:
    build: .
    command: ["streamlit", "run", "/app/.venv/lib/python3.13/site-packages/rag_production_agent/ui/app.py",
              "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
